<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Performance Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <h1 class="app-title">Student Performance Dashboard</h1>
    <p class="app-subtitle">Gradebook for the 31-ITE cohort</p>
  </div>
</header>

<main class="page">

  <section class="controls" aria-label="Search and filters">
    <div class="control-group control-search">
      <label for="searchInput" class="control-label">Search by name</label>
      <input type="text" id="searchInput" placeholder="Enter student name" autocomplete="off">
    </div>

    <div class="control-group">
      <label for="blockFilter" class="control-label">Block</label>
      <select id="blockFilter">
        <option value="All">All</option>
        <option value="31-ITE-01">31-ITE-01</option>
        <option value="31-ITE-02">31-ITE-02</option>
        <option value="31-ITE-03">31-ITE-03</option>
      </select>
    </div>

    <div class="control-group">
      <label for="statusFilter" class="control-label">Status</label>
      <select id="statusFilter">
        <option value="All">All</option>
        <option value="Excellent">Excellent</option>
        <option value="Passed">Passed</option>
        <option value="Needs Improvement">Needs Improvement</option>
        <option value="Failed">Failed</option>
      </select>
    </div>

    <div class="control-group control-buttons">
      <button type="button" id="applyBtn">Apply Filters</button>
      <button type="button" id="resetBtn" class="btn-secondary">Reset</button>
    </div>
  </section>

  <section class="summary" aria-label="Class summary">
    <div class="summary-stat">
      <span class="summary-value" id="displayedCount">0</span>
      <span class="summary-label">Displayed</span>
    </div>
    <div class="summary-stat">
      <span class="summary-value" id="classAverage">0.00</span>
      <span class="summary-label">Class average</span>
    </div>
    <div class="summary-stat">
      <span class="summary-value" id="passingCount">0</span>
      <span class="summary-label">Passing</span>
    </div>
    <div class="summary-stat summary-stat-wide">
      <span class="summary-value" id="topStudent">—</span>
      <span class="summary-label">Top student</span>
    </div>
  </section>

  <div id="messageArea" class="message-area" role="status" aria-live="polite"></div>

  <section id="studentList" class="student-list" aria-label="Student records"></section>

</main>

<footer class="site-footer">
  <p>Weights: Quiz 25%, Laboratory 35%, Prelim Exam 40%.</p>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
